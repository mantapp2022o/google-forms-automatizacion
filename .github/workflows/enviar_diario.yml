name: Enviar Google Forms (martes y jueves)

concurrency:
  group: enviar-forms-diario
  cancel-in-progress: true

on:
  schedule:
    # 14:00 UTC = martes (2) y jueves (4)
    - cron: "0 14 * * 2,4"

jobs:
  enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python enviar_forms.py

      - name: Guardar progreso
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add estado.txt
          git commit -m "Actualizar estado martes/jueves" || echo "Sin cambios"
          git push
